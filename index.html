<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Cumpleaños!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #space {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Fondo de estrellas mediante gradientes CSS asegurados */
        .stars-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1.5px 1.5px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #ffb6c1, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ffd700, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 230px 190px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 250px 250px;
            opacity: 0.8;
            z-index: 1;
        }
        /* Texto flotante estilo cósmico neón */
        .floating-text {
            position: absolute;
            color: #ffc0cb;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            font-weight: 600;
            text-align: center;
            max-width: 80%;
            text-shadow: 0 0 10px #ff1493, 0 0 20px #ff69b4, 0 0 30px #ff1493;
            pointer-events: none;
            z-index: 10;
            line-height: 1.5;
            white-space: pre-line;
            animation: floatUp 8s ease-in-out forwards;
        }
        /* Animación de apertura y elevación de los mensajes */
        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translate(-50%, -40%) scale(0.5);
            }
            15% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
            85% {
                opacity: 1;
                transform: translate(-50%, -55%) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -65%) scale(0.9);
            }
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>
    <canvas id="space"></canvas>

    <script>
        // Mensajes de cumpleaños
        const MESSAGES = [
            "¡Felices 21 años! 🌟\n\nHoy me puse a pensar que, por más que vivamos lejos, la luna que ves tú allá es la misma que veo yo acá... Que cada noche de este año recuerdes que tu luz es única.",
            "¡Felices 21 años! 🌙\n\nA veces me detengo a pensar en cómo los años pasan... Brindo contigo desde la distancia por esta nueva vuelta al sol. ¡Disfruta cada segundo de tu día!",
            "¡Muy feliz cumpleaños! ✨\n\nNuestra complicidad sigue intacta a pesar de la distancia. Que este año de vida te regale risas imprevistas, aprendizajes bonitos y mucha paz.",
            "¡Felices 21! 🌟\n\nQué bonito es verte llegar a esta edad con tanta luz. Que este año te atrevas a lo nuevo y recuerdes que hay alguien muy orgulloso de ti aplaudiéndote desde lejos.",
            "¡Felices 21 años! 🌌\n\nHoy el día se siente diferente. Que este nuevo año te sorprenda con momentos sencillos pero inolvidables y la certeza de que vas por el camino correcto.",
            "¡Muchas felicidades en tus 21! ✨\n\nBrindo por ti, por tus sueños y por todo lo bonito que está por venir a tu vida. ¡Disfruta al máximo tu día, un abrazo gigante hasta allá!"
        ];

        const canvas = document.getElementById('space');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Sistema de Fuegos Artificiales y Regalos Explosivos
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        let particles = [];
        const colors = ['#ff1493', '#ff69b4', '#ffd700', '#00ffff', '#ffffff'];

        function explode(x, y) {
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Mostrar mensajes automáticamente en bucle
        let messageIndex = 0;

        function triggerNextEvent() {
            const x = Math.random() * (canvas.width * 0.6) + (canvas.width * 0.2);
            const y = Math.random() * (canvas.height * 0.4) + (canvas.height * 0.3);

            // Explosión de fuegos artificiales
            explode(x, y);
            setTimeout(() => explode(x + 40, y - 30), 200);

            // Crear elemento de texto flotante
            const textEl = document.createElement('div');
            textEl.className = 'floating-text';
            textEl.style.left = ${x}px;
            textEl.style.top = ${y}px;
            textEl.innerText = MESSAGES[messageIndex];
            document.body.appendChild(textEl);

            // Eliminar texto tras la animación
            setTimeout(() => {
                textEl.remove();
            }, 8000);

            // Siguiente mensaje
            messageIndex = (messageIndex + 1) % MESSAGES.length;
        }

        // Disparar un evento cada 4.5 segundos
        setInterval(triggerNextEvent, 4500);
        triggerNextEvent(); // Primer disparo inmediato

        // Bucle continuo de animación del canvas
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
